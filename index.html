<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>반려동물 커플티 주문</title>

  <!-- 토스페이먼츠 결제 SDK -->
  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f6f8;
      color: #191f28;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.3;
    }

    .header p {
      margin: 0;
      color: #6b7684;
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07);
    }

    .product-image {
      display: block;
      width: 100%;
      height: auto;
      background: #f8eee6;
    }

    .content {
      padding: 25px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #fff0e6;
      color: #e8590c;
      font-size: 13px;
      font-weight: 800;
    }

    .product-title {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.35;
    }

    .description {
      margin: 0 0 22px;
      color: #6b7684;
      font-size: 15px;
      line-height: 1.7;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px 0;
      border-top: 1px solid #edf0f2;
    }

    .info-label {
      color: #4e5968;
      font-weight: 700;
    }

    .info-value {
      text-align: right;
      font-weight: 800;
    }

    .price {
      color: #e8590c;
      font-size: 22px;
      font-weight: 900;
    }

    select {
      min-width: 108px;
      padding: 11px 34px 11px 13px;
      border: 1px solid #d1d6db;
      border-radius: 10px;
      background: #ffffff;
      color: #191f28;
      outline: none;
    }

    select:focus {
      border-color: #3182f6;
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.12);
    }

    .summary-card {
      margin-top: 18px;
      padding: 22px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 13px;
      color: #4e5968;
    }

    .summary-row:last-child {
      margin-bottom: 0;
    }

    .total-row {
      margin-top: 17px;
      padding-top: 18px;
      border-top: 1px solid #edf0f2;
      color: #191f28;
      font-size: 19px;
      font-weight: 900;
    }

    .total-price {
      color: #e8590c;
      font-size: 25px;
    }

    .pay-button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 14px;
      background: #3182f6;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .pay-button:hover {
      transform: translateY(-1px);
    }

    .pay-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .notice {
      margin: 15px 4px 0;
      color: #8b95a1;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .status-box {
      display: none;
      margin-bottom: 20px;
      padding: 24px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      text-align: center;
    }

    .status-box.show {
      display: block;
    }

    .status-box.success {
      border-color: #8ce99a;
      background: #ebfbee;
    }

    .status-box.error {
      border-color: #ffa8a8;
      background: #fff5f5;
    }

    .status-icon {
      margin-bottom: 10px;
      font-size: 42px;
    }

    .status-title {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .status-message {
      margin: 0;
      color: #4e5968;
      line-height: 1.6;
    }

    .order-detail {
      margin-top: 17px;
      padding: 14px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.78);
      color: #333d4b;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .retry-button {
      margin-top: 17px;
      padding: 12px 18px;
      border: 1px solid #d1d6db;
      border-radius: 10px;
      background: #ffffff;
      color: #333d4b;
      font-weight: 800;
      cursor: pointer;
    }

    .loading-box {
      display: none;
      margin-bottom: 20px;
      padding: 25px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      text-align: center;
    }

    .loading-box.show {
      display: block;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 14px;
      border: 4px solid #e5e8eb;
      border-top-color: #3182f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 22px;
      }

      .header h1 {
        font-size: 27px;
      }

      .content {
        padding: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>반려동물 커플티 주문</h1>
      <p>
        반려인과 반려동물이 함께 입는 편안한 커플티입니다.
      </p>
    </header>

    <section id="loadingBox" class="loading-box">
      <div class="spinner"></div>
      <strong>결제를 승인하고 있습니다.</strong>
      <p>화면을 닫거나 새로고침하지 마세요.</p>
    </section>

    <section id="statusBox" class="status-box">
      <div id="statusIcon" class="status-icon"></div>
      <h2 id="statusTitle" class="status-title"></h2>
      <p id="statusMessage" class="status-message"></p>
      <div id="orderDetail" class="order-detail"></div>

      <button
        class="retry-button"
        type="button"
        onclick="returnToOrderPage()"
      >
        주문 페이지로 돌아가기
      </button>
    </section>

    <div id="orderArea">
      <section class="card">
        <!-- 외부 이미지 파일이 필요 없는 내장 SVG 상품 이미지 -->
        <svg
          class="product-image"
          viewBox="0 0 1200 800"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="반려동물 커플티 상품 이미지"
        >
          <defs>
            <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fff7ef" />
              <stop offset="100%" stop-color="#ead7c7" />
            </linearGradient>

            <linearGradient id="shirtColor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#35383d" />
              <stop offset="100%" stop-color="#17191c" />
            </linearGradient>

            <filter id="shadow">
              <feDropShadow
                dx="0"
                dy="18"
                stdDeviation="22"
                flood-color="#000000"
                flood-opacity="0.2"
              />
            </filter>
          </defs>

          <rect width="1200" height="800" fill="url(#background)" />

          <circle cx="160" cy="130" r="90" fill="#ffffff" opacity="0.35" />
          <circle cx="1040" cy="670" r="145" fill="#ffffff" opacity="0.25" />

          <!-- 사람용 티셔츠 -->
          <g filter="url(#shadow)" transform="translate(155 130)">
            <path
              d="
                M210 35
                L320 80
                L420 30
                L530 135
                L455 220
                L405 178
                L405 555
                L115 555
                L115 178
                L65 220
                L0 135
                L110 30
                L210 80
                Z
              "
              fill="url(#shirtColor)"
            />

            <path
              d="M210 35 C225 95 305 95 320 35"
              fill="none"
              stroke="#555a61"
              stroke-width="25"
            />

            <text
              x="260"
              y="315"
              text-anchor="middle"
              fill="#ffffff"
              font-size="78"
              font-family="Arial, sans-serif"
            >
              ♥
            </text>

            <text
              x="260"
              y="375"
              text-anchor="middle"
              fill="#ffffff"
              font-size="27"
              font-weight="700"
              font-family="Arial, sans-serif"
            >
              TOGETHER
            </text>
          </g>

          <!-- 반려동물용 티셔츠 -->
          <g filter="url(#shadow)" transform="translate(705 300)">
            <path
              d="
                M125 25
                L195 55
                L260 25
                L335 95
                L285 155
                L250 125
                L250 355
                L70 355
                L70 125
                L35 155
                L0 95
                L75 25
                L125 55
                Z
              "
              fill="url(#shirtColor)"
            />

            <path
              d="M125 25 C135 68 185 68 195 25"
              fill="none"
              stroke="#555a61"
              stroke-width="17"
            />

            <text
              x="160"
              y="220"
              text-anchor="middle"
              fill="#ffffff"
              font-size="52"
              font-family="Arial, sans-serif"
            >
              ♥
            </text>

            <text
              x="160"
              y="262"
              text-anchor="middle"
              fill="#ffffff"
              font-size="18"
              font-weight="700"
              font-family="Arial, sans-serif"
            >
              TOGETHER
            </text>
          </g>

          <text
            x="600"
            y="725"
            text-anchor="middle"
            fill="#3b302b"
            font-size="42"
            font-weight="800"
            font-family="Arial, sans-serif"
          >
            PET COUPLE T-SHIRT
          </text>
        </svg>

        <div class="content">
          <span class="badge">반려동물 패션</span>

          <h2 class="product-title">반려동물 커플티</h2>

          <p class="description">
            성별 구분 없이 누구나 편안하게 착용할 수 있는
            반려인·반려동물 커플티입니다.
          </p>

          <div class="info-row">
            <span class="info-label">가격</span>
            <strong class="price">50,000원</strong>
          </div>

          <div class="info-row">
            <span class="info-label">사이즈</span>
            <strong class="info-value">Free size</strong>
          </div>

          <div class="info-row">
            <span class="info-label">성별 구분</span>
            <strong class="info-value">없음</strong>
          </div>

          <div class="info-row">
            <label for="quantity" class="info-label">수량</label>

            <select id="quantity">
              <option value="1">1개</option>
              <option value="2">2개</option>
              <option value="3">3개</option>
              <option value="4">4개</option>
              <option value="5">5개</option>
            </select>
          </div>
        </div>
      </section>

      <section class="summary-card">
        <div class="summary-row">
          <span>상품</span>
          <strong>반려동물 커플티</strong>
        </div>

        <div class="summary-row">
          <span>수량</span>
          <strong id="summaryQuantity">1개</strong>
        </div>

        <div class="summary-row total-row">
          <span>총 결제금액</span>
          <strong id="totalPrice" class="total-price">50,000원</strong>
        </div>
      </section>

      <!-- 사용자 이름과 이메일 입력 없이 바로 결제 -->
      <button id="payButton" class="pay-button" type="button">
        50,000원 결제하기
      </button>

      <p class="notice">
        이름과 이메일을 입력하지 않아도 바로 결제할 수 있습니다.<br />
        테스트 클라이언트 키 사용 시 실제 금액은 청구되지 않습니다.
      </p>
    </div>
  </main>

  <script>
    /*
     * 토스페이먼츠 클라이언트 키입니다.
     *
     * 테스트 결제:
     * test_ck_ 또는 test_gck_ 형태의 키 사용
     *
     * 실제 결제:
     * live_ck_ 또는 live_gck_ 형태의 운영 키 사용
     *
     * 시크릿 키는 절대로 이 파일에 넣으면 안 됩니다.
     */
    const CLIENT_KEY =
      "test_ck_Gv6LjeKD8aKb5O1WPkv4VwYxAdXy";

    const PRODUCT = {
      id: "pet-couple-tshirt",
      name: "반려동물 커플티",
      price: 50000,
      size: "Free size",
      gender: "성별 구분 없음"
    };

    const quantitySelect = document.getElementById("quantity");
    const summaryQuantity =
      document.getElementById("summaryQuantity");
    const totalPriceElement =
      document.getElementById("totalPrice");
    const payButton = document.getElementById("payButton");

    const orderArea = document.getElementById("orderArea");
    const loadingBox = document.getElementById("loadingBox");
    const statusBox = document.getElementById("statusBox");
    const statusIcon = document.getElementById("statusIcon");
    const statusTitle = document.getElementById("statusTitle");
    const statusMessage = document.getElementById("statusMessage");
    const orderDetail = document.getElementById("orderDetail");

    function formatWon(amount) {
      return (
        new Intl.NumberFormat("ko-KR").format(amount) + "원"
      );
    }

    function getQuantity() {
      return Number(quantitySelect.value);
    }

    function getTotalAmount() {
      return PRODUCT.price * getQuantity();
    }

    function updateOrderSummary() {
      const quantity = getQuantity();
      const amount = getTotalAmount();

      summaryQuantity.textContent = `${quantity}개`;
      totalPriceElement.textContent = formatWon(amount);
      payButton.textContent = `${formatWon(amount)} 결제하기`;
    }

    function createRandomId(prefix) {
      const randomPart =
        crypto.randomUUID?.().replaceAll("-", "") ||
        Math.random().toString(36).slice(2) +
          Date.now().toString(36);

      return `${prefix}_${randomPart}`.slice(0, 50);
    }

    function createOrderId() {
      return createRandomId("ORDER");
    }

    function createCustomerKey() {
      /*
       * 비회원 결제이므로 결제 요청마다 임시 고객 키를 생성합니다.
       * 이름이나 이메일은 필요하지 않습니다.
       */
      return createRandomId("guest");
    }

    async function requestPayment() {
      if (!CLIENT_KEY || !CLIENT_KEY.startsWith("test_") &&
          !CLIENT_KEY.startsWith("live_")) {
        alert("CLIENT_KEY를 올바른 토스 클라이언트 키로 설정해주세요.");
        return;
      }

      const quantity = getQuantity();
      const amount = getTotalAmount();
      const orderId = createOrderId();
      const customerKey = createCustomerKey();

      const orderName =
        quantity === 1
          ? PRODUCT.name
          : `${PRODUCT.name} ${quantity}개`;

      sessionStorage.setItem(
        "pendingOrder",
        JSON.stringify({
          orderId,
          orderName,
          amount,
          quantity,
          product: PRODUCT
        })
      );

      payButton.disabled = true;
      payButton.textContent = "결제창을 열고 있습니다.";

      try {
        const tossPayments = TossPayments(CLIENT_KEY);

        const payment = tossPayments.payment({
          customerKey
        });

        await payment.requestPayment({
          method: "CARD",

          amount: {
            currency: "KRW",
            value: amount
          },

          orderId,
          orderName,

          successUrl:
            window.location.origin +
            window.location.pathname +
            "?payment=success",

          failUrl:
            window.location.origin +
            window.location.pathname +
            "?payment=fail"
        });
      } catch (error) {
        console.error("결제 요청 오류:", error);

        payButton.disabled = false;
        updateOrderSummary();

        alert(
          error?.message ||
          "결제창을 여는 중 오류가 발생했습니다."
        );
      }
    }

    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);

      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = Number(params.get("amount"));

      let pendingOrder = null;

      try {
        const savedOrder =
          sessionStorage.getItem("pendingOrder");

        pendingOrder = savedOrder
          ? JSON.parse(savedOrder)
          : null;
      } catch (error) {
        console.error("주문 정보 확인 오류:", error);
      }

      orderArea.style.display = "none";
      loadingBox.classList.add("show");

      if (!paymentKey || !orderId || !Number.isFinite(amount)) {
        loadingBox.classList.remove("show");

        showStatus({
          success: false,
          title: "결제 정보가 올바르지 않습니다.",
          message: "결제 승인 정보가 전달되지 않았습니다."
        });

        return;
      }

      if (
        pendingOrder &&
        (
          pendingOrder.orderId !== orderId ||
          Number(pendingOrder.amount) !== amount
        )
      ) {
        loadingBox.classList.remove("show");

        showStatus({
          success: false,
          title: "주문 정보가 일치하지 않습니다.",
          message: "주문번호 또는 결제 금액이 변경되었습니다."
        });

        return;
      }

      try {
        /*
         * Vercel 서버 함수로 결제를 승인합니다.
         * 아래에 제공된 api/confirm.js 파일이 필요합니다.
         */
        const response = await fetch("/api/confirm", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            paymentKey,
            orderId,
            amount
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.message ||
            result.error?.message ||
            result.code ||
            "결제 승인에 실패했습니다."
          );
        }

        loadingBox.classList.remove("show");
        sessionStorage.removeItem("pendingOrder");

        showStatus({
          success: true,
          title: "결제가 완료되었습니다.",
          message: "주문이 정상적으로 승인되었습니다.",
          detail: `
            <strong>상품명</strong>: 반려동물 커플티<br />
            <strong>수량</strong>: ${pendingOrder?.quantity || 1}개<br />
            <strong>사이즈</strong>: Free size<br />
            <strong>성별 구분</strong>: 없음<br />
            <strong>주문번호</strong>: ${escapeHtml(orderId)}<br />
            <strong>결제금액</strong>: ${formatWon(amount)}
          `
        });
      } catch (error) {
        console.error("결제 승인 오류:", error);

        loadingBox.classList.remove("show");

        showStatus({
          success: false,
          title: "결제 승인에 실패했습니다.",
          message:
            error?.message ||
            "잠시 후 다시 시도해주세요.",
          detail: `
            <strong>주문번호</strong>: ${escapeHtml(orderId)}<br />
            <strong>요청금액</strong>: ${formatWon(amount)}
          `
        });
      }
    }

    function handlePaymentFailure() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get("code") || "UNKNOWN_ERROR";
      const message =
        params.get("message") ||
        "결제가 취소되었거나 실패했습니다.";

      orderArea.style.display = "none";

      showStatus({
        success: false,
        title:
          code === "PAY_PROCESS_CANCELED"
            ? "결제가 취소되었습니다."
            : "결제를 완료하지 못했습니다.",
        message,
        detail: `<strong>오류 코드</strong>: ${escapeHtml(code)}`
      });
    }

    function showStatus({
      success,
      title,
      message,
      detail = ""
    }) {
      statusBox.className =
        `status-box show ${success ? "success" : "error"}`;

      statusIcon.textContent = success ? "✅" : "⚠️";
      statusTitle.textContent = title;
      statusMessage.textContent = message;

      if (detail) {
        orderDetail.style.display = "block";
        orderDetail.innerHTML = detail;
      } else {
        orderDetail.style.display = "none";
        orderDetail.innerHTML = "";
      }
    }

    function returnToOrderPage() {
      sessionStorage.removeItem("pendingOrder");

      window.location.href =
        window.location.origin + window.location.pathname;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    quantitySelect.addEventListener(
      "change",
      updateOrderSummary
    );

    payButton.addEventListener("click", requestPayment);

    updateOrderSummary();

    const queryParams =
      new URLSearchParams(window.location.search);

    const paymentResult = queryParams.get("payment");

    if (paymentResult === "success") {
      confirmPayment();
    } else if (paymentResult === "fail") {
      handlePaymentFailure();
    }
  </script>
</body>
</html>
